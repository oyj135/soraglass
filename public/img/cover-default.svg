<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <!-- 默认封面：只放渐变与几何，不写字。
       它同时被用作文章占位封面（16:9 铺满）和唱片封面（1:1 裁切 + 中心孔），
       写在正中的文字最后一定会被圆孔吃掉，所以保持纯图形最稳。 -->
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a18cd1"/><stop offset=".5" stop-color="#fbc2eb"/><stop offset="1" stop-color="#a1c4fd"/></linearGradient>
    <radialGradient id="rg" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".26"/></radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#c)"/>
  <!-- 唱片纹：同心圆，裁成圆形后正好落在圆盘内 -->
  <g fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="1.5">
    <circle cx="400" cy="225" r="210"/>
    <circle cx="400" cy="225" r="170"/>
    <circle cx="400" cy="225" r="130"/>
    <circle cx="400" cy="225" r="92"/>
  </g>
  <circle cx="400" cy="225" r="226" fill="url(#rg)"/>
  <circle cx="636" cy="84" r="62" fill="#fff" opacity=".26"/>
  <path d="M0 350 Q200 280 400 340 T800 320 V450 H0Z" fill="#fff" opacity=".16"/>
  <g fill="#fff" opacity=".7"><circle cx="96" cy="86" r="3"/><circle cx="228" cy="150" r="2"/><circle cx="330" cy="66" r="3"/><circle cx="516" cy="196" r="2"/><circle cx="706" cy="256" r="3"/><circle cx="150" cy="308" r="2"/></g>
</svg>
