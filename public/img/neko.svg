<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 墨龙攀绳（2026-11-22 第五十五轮，替代 Fomalhaut 小猫）：
       玄墨龙身沿绳轴三叠盘绕，灰青底笔做浓淡，龙头朝左开口衔珠，
       龙眼与衔珠是全图仅有的两点朱批；feTurbulence 抖边做飞白。
       绳由 CSS 的 .sg-neko-rope 画（竹节纹）。 -->
  <defs>
    <filter id="ink" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.3"/>
    </filter>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d44"/>
      <stop offset=".5" stop-color="#252229"/>
      <stop offset="1" stop-color="#474a52"/>
    </linearGradient>
  </defs>
  <g filter="url(#ink)" fill="none" stroke-linecap="round">
    <!-- 龙身：三叠盘绕，底笔浓淡两层 -->
    <path d="M28 16 C44 14 46 22 32 24 C18 26 20 34 36 36 C50 38 46 46 30 48 C20 50 22 56 34 58" stroke="#919795" stroke-width="10" opacity=".42"/>
    <path d="M28 16 C44 14 46 22 32 24 C18 26 20 34 36 36 C50 38 46 46 30 48 C20 50 22 56 34 58" stroke="url(#body)" stroke-width="6"/>
    <!-- 尾梢收细回勾 -->
    <path d="M34 58 C40 59 43 61 42 63" stroke="#252229" stroke-width="2.6" opacity=".85"/>
    <!-- 背脊鳍刺 -->
    <path d="M40 15 l3 -3 M44 20 l4 -2 M20 28 l-4 -2 M44 37 l4 -2 M22 51 l-4 -2" stroke="#252229" stroke-width="1.5"/>
    <!-- 双角 -->
    <path d="M28 8 C31 4 35 3 39 4 M25 7 C26 3 29 1 33 1" stroke="#252229" stroke-width="1.8"/>
    <!-- 双须 -->
    <path d="M14 12 C10 13 7 16 6 20 M15 15 C11 17 9 21 10 25" stroke="#6a706c" stroke-width="1" opacity=".9"/>
    <!-- 前后爪 -->
    <path d="M44 24 l5 2 M30 49 l-5 2" stroke="#252229" stroke-width="1.6"/>
    <!-- 开口下颚 -->
    <path d="M24 16 C19 17 15 16 12 14" stroke="#252229" stroke-width="2"/>
  </g>
  <!-- 龙头：一笔侧脸 -->
  <path d="M22 10 C27 9 31 10 32 13 C30 15 27 16 24 16 C22 15 21 12 22 10 Z" fill="#2c2f36"/>
  <!-- 龙眼：朱批一 -->
  <circle cx="25.5" cy="12.8" r="1.3" fill="#9d3b2f"/>
  <!-- 衔珠：朱批二 -->
  <circle cx="9" cy="10" r="2" fill="#9d3b2f" opacity=".92"/>
</svg>
